name: Deploy Todo Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: self-hosted

    steps:
      - name: 📥 Checkout latest code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: 📝 Create .env file with secrets
        run: |
          cat > .env << 'ENVEOF'
          # Database
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/todo_bot

          # Claude AI (task parsing)
          CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_MODEL=claude-haiku-4-5-20251001

          # Telegram Bot
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_URL=${{ secrets.TELEGRAM_WEBHOOK_URL }}
          TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_STORAGE_CHANNEL_ID=${{ secrets.TELEGRAM_STORAGE_CHANNEL_ID }}

          # Security
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=43200

          # CORS
          BACKEND_CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost"]

          # Application
          DEBUG=false
          ENVEOF

          echo "✅ .env file created with secrets"

      - name: 🔍 Verify .env file
        run: |
          echo "📋 .env content (masked):"
          cat .env | grep -v "API_KEY\|SECRET\|TOKEN" || true

      - name: 🛑 Stop existing containers
        run: |
          echo "Stopping existing containers..."
          docker compose down || true

      - name: 🏗️ Build and start new containers
        run: |
          echo "Building Docker images and starting containers..."
          docker compose up -d --build

      - name: ⏳ Wait for services to initialize
        run: |
          echo "Waiting 30 seconds for services to start..."
          sleep 30

      - name: 🏥 Check container status
        run: |
          echo "Container status:"
          docker compose ps

      - name: 🔍 Check backend logs
        if: always()
        run: |
          echo "📋 Backend logs (last 50 lines):"
          docker logs todo-bot-backend --tail=50 || echo "❌ Cannot fetch backend logs"

      - name: 🔍 Check frontend logs
        if: failure()
        run: |
          echo "📋 Frontend logs (last 50 lines):"
          docker logs todo-bot-frontend --tail=50 || echo "❌ Cannot fetch frontend logs"

      - name: 🧪 Test backend API
        if: success()
        run: |
          echo "Testing backend API..."
          curl -f http://localhost:8000/health || echo "⚠️ Backend health check failed"

      - name: 🎉 Deployment complete
        if: success()
        run: |
          echo "✅ Todo Bot deployed successfully!"
          echo "🌐 Web UI: https://jalolyusuf.info (Telegram Mini App only)"
          echo "🤖 Telegram Bot: @td_ls_bot"
          echo "📚 API Docs: http://localhost:8000/docs"

      - name: 📊 Deployment Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅ Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Todo Bot - Vazifa Eslatuvchi**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- 🌐 **Web UI:** https://jalolyusuf.info" >> $GITHUB_STEP_SUMMARY
            echo "- 🤖 **Telegram:** @td_ls_bot" >> $GITHUB_STEP_SUMMARY
            echo "- 🔒 **Access:** Telegram Mini App only" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** main" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
