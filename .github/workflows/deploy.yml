name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Manual trigger

jobs:
  deploy:
    name: Deploy to Server
    runs-on: self-hosted

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Server
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -e

          echo "📁 Navigating to project..."
          cd $HOME/Downloads/ToDo-BOT || exit 1

          echo "📥 Pulling latest code..."
          git fetch origin main
          git reset --hard origin/main

          echo "🔧 Updating bot token..."
          sed -i "s|TELEGRAM_BOT_TOKEN=.*|TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN|" .env

          echo "🐳 Rebuilding containers..."
          docker compose down
          docker compose up -d --build

          echo "⏳ Waiting for containers..."
          sleep 15

          echo "🗃️  Running migrations..."
          docker compose exec -T backend alembic upgrade head

          echo "🏥 Health check..."
          curl -f http://localhost:8000/api/v1/health || curl -f https://jalolyusuf.info/api/v1/health || exit 1

          echo "🤖 Setting webhook..."
          curl -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setWebhook" \
            -H "Content-Type: application/json" \
            -d '{"url":"https://jalolyusuf.info/api/v1/telegram/webhook"}'

          echo "✅ Deployment completed!"

      - name: 📊 Deployment Summary
        if: success()
        run: |
          echo "### ✅ Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** main" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Server:** https://jalolyusuf.info" >> $GITHUB_STEP_SUMMARY
          echo "- **Health:** https://jalolyusuf.info/api/v1/health" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "### ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
