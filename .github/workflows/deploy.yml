name: Deploy Claude AI Assistant Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: self-hosted

    steps:
      - name: 📥 Checkout latest code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: 📝 Create .env file with secrets
        run: |
          cat > .env << 'ENVEOF'
          # Database
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/claude_ai_bot

          # AWS Bedrock Configuration
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          BEDROCK_MODEL_ID=anthropic.claude-3-haiku-20240307-v1:0

          # Claude AI Settings
          MAX_TOKENS=4096
          TEMPERATURE=1.0

          # Telegram Bot
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_URL=${{ secrets.TELEGRAM_WEBHOOK_URL }}
          TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}

          # Security
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=43200

          # CORS
          BACKEND_CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost"]

          # Application
          DEBUG=false
          ENVEOF

          echo "✅ .env file created with secrets"

      - name: 🔍 Verify project structure
        run: |
          echo "📂 Frontend structure:"
          ls -la frontend/src/ || echo "❌ frontend/src not found"
          ls -la frontend/src/styles/ || echo "❌ frontend/src/styles not found"

          echo ""
          echo "📂 Backend structure:"
          ls -la backend/app/ || echo "❌ backend/app not found"

      - name: 🛑 Stop existing containers
        run: |
          echo "Stopping existing containers..."
          docker compose down || true

      - name: 🏗️ Build and start new containers
        run: |
          echo "Building Docker images and starting containers..."
          docker compose up -d --build

      - name: ⏳ Wait for services to initialize
        run: |
          echo "Waiting 30 seconds for services to start..."
          sleep 30

      - name: 🏥 Check container status
        run: |
          echo "Container status:"
          docker compose ps

      - name: 🔍 Check backend logs
        if: always()
        run: |
          echo "📋 Backend logs (last 100 lines):"
          docker compose logs backend --tail=100 || echo "❌ Cannot fetch backend logs"

      - name: 🔍 Check frontend logs
        if: failure()
        run: |
          echo "📋 Frontend logs (last 100 lines):"
          docker compose logs frontend --tail=100 || echo "❌ Cannot fetch frontend logs"

      - name: 🎉 Deployment complete
        if: success()
        run: |
          echo "✅ Claude AI Assistant Bot deployed successfully!"
          echo "🌐 Backend API: http://$(hostname -I | awk '{print $1}'):8000"
          echo "🌐 Frontend: http://$(hostname -I | awk '{print $1}')"
          echo "📚 API Docs: http://$(hostname -I | awk '{print $1}'):8000/docs"

      - name: 📊 Deployment Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅ Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** main" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
